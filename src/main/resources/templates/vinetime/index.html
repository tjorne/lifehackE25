<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VineTime</title>
    <link rel="stylesheet" href="/css/vinetime.css" />
</head>

<body class="min-h-screen bg-[#FAF8F3]">

<nav class="fixed top-0 left-0 right-0 z-40 bg-[#FAF8F3]/80 backdrop-blur-[10px] border-b border-black/5">
    <div class="max-w-[1200px] mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center">
            <img src="/images/vinetime/Logo.png" alt="VineTime" class="h-12 w-auto object-contain" />
        </div>
        <div class="flex items-center gap-3">
            <button id="historyBtn" style="background-color: #234423; color: #FAF8F3;" class="px-6 py-3 rounded-2xl transition-all duration-120 transform hover:brightness-105 active:scale-98 shadow-[0_4px_10px_rgba(0,0,0,0.1)] font-medium text-base">History</button>
            <button id="loginBtn" th:if="${session.currentUser == null}" style="background-color: #234423; color: #FAF8F3;" class="px-6 py-3 rounded-2xl transition-all duration-120 transform hover:brightness-105 active:scale-98 shadow-[0_4px_10px_rgba(0,0,0,0.1)] font-medium text-base">Login</button>
            <a th:if="${session.currentUser != null}" href="/logout" style="background-color: #E53935; color: #FAF8F3;" class="px-6 py-3 rounded-2xl transition-all duration-120 transform hover:brightness-105 active:scale-98 shadow-[0_4px_10px_rgba(0,0,0,0.1)] font-medium text-base inline-block">Logout</a>
        </div>
    </div>
</nav>

<div class="flex flex-col items-center justify-center min-h-screen p-6 pt-24 gap-8">
    <h1 class="vt-heading text-[#234423]">VineTime</h1>

    <div class="flex items-center rounded-2xl bg-white/50 p-1 shadow-[0_4px_10px_rgba(0,0,0,0.1)] border border-black/5">
        <button id="pomodoroTab" class="relative px-6 py-3 rounded-2xl transition-all duration-120 hover:bg-white/70 vt-subheading transform hover:brightness-105 active:scale-98 bg-white shadow-[0_4px_10px_rgba(0,0,0,0.1)] text-[#234423]">Pomodoro</button>
        <button id="shortBreakTab" class="relative px-6 py-3 rounded-2xl transition-all duration-120 hover:bg-white/70 vt-subheading transform hover:brightness-105 active:scale-98 text-gray-600 hover:text-[#234423]">Short Break</button>
        <button id="longBreakTab" class="relative px-6 py-3 rounded-2xl transition-all duration-120 hover:bg-white/70 vt-subheading transform hover:brightness-105 active:scale-98 text-gray-600 hover:text-[#234423]">Long Break</button>
    </div>

    <div class="relative flex flex-col items-center">
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-80 h-80 md:w-96 md:h-96 rounded-full opacity-25 bg-gradient-radial from-[#B8391A] to-transparent pointer-events-none"></div>
        <div class="relative">
            <img src="/images/vinetime/Tomato.png" alt="Pomodoro Timer" class="w-80 h-80 md:w-96 md:h-96 object-contain relative z-10" />
        </div>
        <div class="mt-2 text-center">
            <div id="timer" class="vt-heading text-5xl md:text-6xl leading-none font-bold text-[#234423]">25:00</div>
        </div>
        <div class="mt-4 text-center">
            <p class="text-[#2D5016] italic text-sm opacity-80">Stay rooted. Focus grows with time.</p>
        </div>
    </div>

    <div class="flex flex-col items-center gap-6">
        <div class="flex items-center justify-center gap-6">
            <button id="playBtn" class="flex items-center justify-center w-16 h-16 rounded-full transition-all duration-120 shadow-[0_4px_10px_rgba(0,0,0,0.1)] hover:shadow-[0_6px_15px_rgba(0,0,0,0.15)] transform hover:brightness-105 active:scale-98 bg-[#E53935] text-white">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="ml-1"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
            </button>
            <button id="resetBtn" class="flex items-center justify-center w-12 h-12 rounded-full bg-white border border-gray-200 text-[#234423] hover:text-[#234423]/80 hover:border-[#234423]/30 transition-all duration-120 shadow-[0_4px_10px_rgba(0,0,0,0.1)] hover:shadow-md transform hover:brightness-105 active:scale-98">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
            </button>
        </div>

        <div class="flex items-center justify-center">
            <button id="musicBtn" class="relative flex items-center justify-center w-12 h-12 rounded-full border transition-all duration-250 shadow-[0_4px_10px_rgba(0,0,0,0.1)] transform hover:brightness-105 active:scale-98 group bg-[#234423] text-white border-[#234423]">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <div class="text-center">
        <p class="vt-accent-text">Today: <span id="sessionCount" class="text-[#E53935]">0 sessions</span></p>
    </div>
</div>

<div id="loginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-[10px]">
    <div class="bg-[#FAF9F5] rounded-2xl w-full max-w-[720px] mx-auto shadow-[0_4px_10px_rgba(0,0,0,0.1)]">
        <div class="p-6 md:p-8">
            <div class="flex items-center justify-between mb-6">
                <h2 class="vt-heading text-[#234423] text-2xl md:text-[32px] leading-none">Welcome Back</h2>
                <button id="closeLoginModal" class="w-10 h-10 rounded-full bg-[#234423] flex items-center justify-center text-white hover:brightness-105 active:scale-98 transition-all duration-120">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" /></svg>
                </button>
            </div>

            <form action="/api/vinetime/login" method="post" class="space-y-6">
                <div class="space-y-2">
                    <label for="email" class="block vt-subheading text-[#234423]">Username</label>
                    <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 py-3 shadow-[0_4px_10px_rgba(0,0,0,0.1)]">
                        <svg class="mr-3 opacity-80" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2l8 6 8-6" stroke="#234423" stroke-width="2" fill="none" />
                        </svg>
                        <input id="email" name="username" type="text" required placeholder="your@email.com" class="flex-1 focus:outline-none placeholder-[#234423]/50 text-[#234423]" />
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="password" class="block vt-subheading text-[#234423]">Password</label>
                    <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 py-3 shadow-[0_4px_10px_rgba(0,0,0,0.1)]">
                        <svg class="mr-3 opacity-80" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M6 10V8a6 6 0 1 1 12 0v2m-9 4h6m-9 6h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2z" stroke="#234423" stroke-width="2" fill="none" />
                        </svg>
                        <input id="password" name="password" type="password" required placeholder="••••••••" class="flex-1 focus:outline-none placeholder-[#234423]/50 text-[#234423]" />
                    </div>
                </div>

                <button type="submit" class="w-full px-6 py-4 rounded-2xl transition-all duration-120 transform hover:brightness-105 active:scale-98 shadow-[0_4px_10px_rgba(0,0,0,0.1)] font-medium text-base" style="background-color:#B8391A; color:#FAF8F3;">
                    Sign In
                </button>

                <p class="text-center vt-body text-[#234423]">
                    Don't have an account?
                    <a href="/signup" class="underline text-[#B8391A]">Sign up</a>
                    <a href="#" id="fillTest" class="underline text-[#B8391A] ml-2">Use test account</a>
                </p>
            </form>
        </div>
    </div>
</div>

<div id="historyModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-[10px]">
    <div class="bg-[#FAF9F5] rounded-2xl w-full max-w-2xl mx-auto max-h-[90vh] overflow-hidden" style="box-shadow: 0 4px 20px rgba(0,0,0,0.15)">
        <div class="p-6 border-b border-[#4A7A45]/60">
            <div class="flex items-center justify-between mb-4">
                <h2 class="vt-subheading text-[#234423]">Session History</h2>
                <button id="closeHistoryModal" class="w-8 h-8 rounded-full bg-[#234423] flex items-center justify-center text-white hover:brightness-105">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
            <p class="vt-body text-[#234423]">Your session history will appear here.</p>
        </div>
    </div>
</div>

<script src="/js/vinetime.js"></script>
</body>
</html>
